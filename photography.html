<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Portfolio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: visible;
        }

        header {
            padding: 20px;
            background: white;
        }
        header h1 { margin-bottom: 10px; color: #111;}
        header p { color: #666; }

        .collage-container {
            /*flex-grow: 1;
            overflow-y: auto;*/
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(30vh, 1fr));
            /*grid-auto-rows: 350px;*/
            grid-auto-flow: dense;
            gap: 0;
            border: 2px solid black;
            background: black;
        }

        .item {
            border: 2px solid black;
            position: relative;
            overflow: hidden;
            background-color: black;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .wide { grid-column: span 2; }
        .tall { grid-row: span 2; }
        .big { grid-column: span 2; grid-row: span 2; }
        .link {cursor: pointer;}

        .text-box { padding: 10px; font-weight: bold; color: white;}
        .game-box { background: #333; color: white; width: 100%; height: 100%; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none; /* Hidden by default */
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            max-width: 400px;
        }
        .modal-content button {
            margin-top: 20px;
            padding: 10px 20px;
            cursor: pointer;
        }
        .close-btn {
            position: absolute;
            top: 10px; right: 10px;
            cursor: pointer;
            font-size: 20px;
        }
        .size-md {
            grid-column: span 2;
            grid-row: span 1;
        }

        .size-lg-game {
            grid-column: span 3;
            grid-row: span 2;
        }
        .fixed-size {
            /*width: 300px !important;*/
            height: 500px !important;
            grid-column: span 2 !important;
            grid-row: auto !important;
        }

        a {
            display: inline-block;
            width: 100%;
            height: 100%;
            color: white;
        }

        a img {
            object-fit: cover;
            display: block;
        }

    </style>
</head>
<body>

    <header>
        <h1>Photography</h1>
    </header>

    <div class="collage-container" id="collage">
        <div class="item wide" data-type="nothing">
            <img src="/1.JPG" title="That's me!">
        </div>

        <div class="item wide" data-type="nothing">
            <img src="/deer.JPG" title="deer">
        </div>

        <div class="item wide" data-type="nothing">
            <img src="/mountain.JPG" title="mountain">
        </div>

        <div class="item wide" data-type="nothing">
            <img src="/valley.JPG" title="valley">
        </div>

        <div class="item" data-type="nothing">
            <img src="/al2.jpg">
        </div>

        <div class="item wide" data-type="nothing">
            <img src="/2.JPG">
        </div>

        <div class="item" data-type="nothing">
            <img src="/ac.jpg">
        </div>

        <div class="item wide" data-type="nothing">
            <img src="/dock.JPG">
        </div>

        <div class="item wide" data-type="nothing">
            <img src="/s.jpg">
        </div>
    </div>
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <h2 id="modalTitle">Title</h2>
            <p id="modalText">Description goes here.</p>
<!--             <button id="modalBtn">Go to Page</button> -->
        </div>
    </div>

    <script>
        const collage = document.getElementById('collage');
        const modal = document.getElementById('modalOverlay');
        const closeModal = document.getElementById('closeModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalText = document.getElementById('modalText');
        //const modalBtn = document.getElementById('modalBtn');

        collage.addEventListener('click', (e) => {
            const item = e.target.closest('.item');
            if (!item) return;

            const type = item.getAttribute('data-type');

            if (type === 'link') {
                // Redirect immediately
                window.location.href = item.getAttribute('data-url');
            } 
            else if (type === 'popup') {
                showPopup(
                    item.getAttribute('data-title'),
                    item.getAttribute('data-text'),
                    item.getAttribute('data-url') || '#' // fallback
                );
            }
            else {console.log("nothing")}
        });

        function showPopup(title, text, url) {
            modalTitle.innerText = title;
            modalText.innerText = text;
            // modalBtn.onclick = () => {
            //     window.location.href = url;
            // };
            modal.style.display = 'flex';
        }

        // close the modal
        closeModal.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        window.addEventListener('click', (e) => {
            if (e.target === modal) modal.style.display = 'none';
        });
    </script>
</body>
</html>
